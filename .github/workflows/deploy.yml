# =============================================================================
#  This rebuilds and republishes allansabc.com automatically.
#
#  You do not need to understand this file or ever open it.
#
#  What it does: every time anything changes in the repository, it rebuilds the
#  website from the content/ folder and puts the new version online. Takes about
#  a minute. You can watch it happen under the "Actions" tab at the top of
#  GitHub: a yellow dot means it's working, green tick means it's live, a red X
#  means something in content/ has a typo and the OLD site is still up, unharmed.
# =============================================================================

name: Build and publish the website

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two edits land close together, finish the newest one and skip the middle.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install --quiet pyyaml jinja2

      - name: Build the website from the content folder
        run: python build.py

      - name: Check the brand colours still pass accessibility
        run: python scripts/check_contrast.py

      - name: Package it up
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Put it online
        id: deployment
        uses: actions/deploy-pages@v4
