# =============================================================================
#  4. PHOTOS
#  Every picture on the website, in one place.
# =============================================================================
#
#  HOW TO SWAP A PHOTO
#  -------------------
#  1. Go to the folder  site/assets/img/  in GitHub.
#  2. Click "Add file" -> "Upload files" and drop your new photo in.
#  3. Come back here and change the "file:" line to your new file name.
#
#  EASIEST TRICK: name your new photo exactly the same as the old one
#  (for example  hero-terrace.jpg  ) and upload it. Then you don't need to
#  change anything in this file at all. The website just picks up the new one.
#
#  You can also point "file:" at a full web address if the photo lives
#  somewhere else, for example:
#      file: https://example.com/photos/new-terrace.jpg
#
#  ALWAYS write a "description:". It is read aloud to blind visitors and
#  shown if the photo fails to load. Describe what is in the picture.
#
# =============================================================================


# --- The big photo at the top of the page ------------------------------------

