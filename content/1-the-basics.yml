# --- The little badge in the top corner of the homepage ----------------------
# Set show to  no  to hide it completely.

badge:
  show: yes
  text: ★ 10 years · Sat 5 Sept


# --- Numbers we show off -----------------------------------------------------
# Update these when the review counts move.

stats:
  - number: "4.4"
    label: Google · 1,550 reviews
  - number: 92%
    label: Recommend on Facebook
  - number: "10"
    label: Years on Rykestraße


# --- The scrolling strip of sayings ------------------------------------------
# Add or remove lines freely. Each "- " is one saying.

scrolling_words:
  - Rosé all day, everyday
  - Drink Provence water
  - The one and only rosé café in Berlin
  - You look thirsty (we can help)
  - Day drinking since 2015


# --- The "about us" paragraphs ----------------------------------------------

about:
  heading: |
    The one and only
    rosé café in Berlin

  intro: A Frenchman, an Australian breakfast, and a fridge full of Provence rosé. On a Prenzlauer Berg side street, with the sun on the terrace and nowhere else to be.

  paragraphs:
    - "Allan came to Berlin the long way round, by way of Australia, and brought the good bits with him: the coffee, the eggs, the refusal to take a Tuesday too seriously. Then he added the French half. Rosé at lunchtime. Sometimes oysters at six, when we feel like it. A bar that stays open because the sun is still out."
    - The rosé is the point. Mostly Provence, always cold, poured from the moment we open without anyone raising an eyebrow. Pink in the glass, yellow over your head, and a whole afternoon in front of you.
    - "Ten years on Rykestraße and some things have not moved: the eggs Benny, the striped awning, the fact that we still only take cash."
