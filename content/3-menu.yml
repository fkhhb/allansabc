# =============================================================================
#  3. THE MENU
#  The food photos that slide across the homepage, and the two menu buttons.
# =============================================================================
#
#  HOW TO EDIT
#  -----------
#  The homepage does not list dishes or prices. It shows a sliding row of food
#  photos and two buttons, and the buttons open the real menus. That way the
#  PDFs are the only place a price ever lives, and the website can never
#  disagree with them.
#
#  To change which photos slide across, edit the "carousel" list below.
#  To change a menu, upload a new PDF (instructions further down).
#
# =============================================================================

heading: The food
# AUTO means "work it out from 2-opening-hours.yml and never let it go stale".
# Replace AUTO with your own words any time you want to say something else.
kicker: AUTO
intro: Aussie brunch, cooked by a Frenchman. The eggs Benny turns up in a hundred separate Google reviews and we are not going to pretend that is an accident.


# --- The food carousel -------------------------------------------------------
#
#  The photos that slide across under the heading. Each name must match one in
#  the "dishes" list in 4-photos.yml. Reorder them, add more, remove some. Three
#  is the minimum that looks right; there is no maximum.

carousel:
  - dish-eggs-benny
  - dish-benny-rose
  - dish-french-toast
  - dish-benny-salmon
  - dish-open-toast
  - dish-bowl
  - dish-sweet


# --- The full menu PDFs ------------------------------------------------------
#
#  TO UPDATE A MENU:
#  Go to the folder  site/assets/menus/  in GitHub, click "Add file" ->
#  "Upload files", and drop in the new PDF. Then change the file name below
#  to match what you uploaded. Keep "assets/menus/" at the front.
#
#  Tip: if you upload the new PDF using the SAME file name as the old one,
#  you don't have to change anything here at all.

menus:
  food:
    label: Food menu
    file: assets/menus/allans-abc-food-menu.pdf
  drinks:
    label: Drinks menu
    file: assets/menus/allans-abc-drinks-menu.pdf

# The small print under the menu buttons.
menu_note: Sourdough comes from le Brot Bäckerei. Gluten-free bread from Jute Bäckerei in Mitte, plus €1.50. Full allergen list is on the menu. Cash only, and we don't split bills.


# --- The drinks panel --------------------------------------------------------

drinks_panel:
  heading: Coffee, tea & the good stuff
  intro: Coffee roasted in Berlin, and everything that comes after it. Spritzes from ten, Bloody Marys for the brave, frosé when the terrace gets going.
  note: "Margaritas: cheaper than therapy. All prices in €, cash only, and we don't split bills."
